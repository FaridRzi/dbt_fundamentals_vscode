sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        description: Raw payments data
        columns:
          - name: status
            description: '{{ doc("payment_status") }}'
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}